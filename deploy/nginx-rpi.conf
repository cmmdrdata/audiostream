# /etc/nginx/sites-available/rpi-apps
# One public port (8080) for every app on the Pi:
#   http://stevenj.ddns.info:8080/                -> local app on 127.0.0.1:8083
#   http://stevenj.ddns.info:8080/mexican-train/  -> Mexican Train on 127.0.0.1:8081
#   http://stevenj.ddns.info:8080/audiostream/    -> AudioStream on 127.0.0.1:8082
#
# nginx itself takes port 8080, so whatever served "/" on 8080 before has to
# move to another port (8083 below). Only 8080 needs forwarding on the router.

# Lets WebSocket connections (live game updates) pass through
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name stevenj.ddns.info _;

    # Audiobook files are large and seeking sends many range requests
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---------- Mexican Train (8081) ----------
    location = /mexican-train { return 301 $scheme://$http_host/mexican-train/; }
    location /mexican-train/ {
        # The trailing slash strips the /mexican-train/ prefix,
        # so the game still sees "/" as its own root.
        proxy_pass http://127.0.0.1:8081/;
        proxy_read_timeout 1h;        # keep idle game sockets open
        proxy_send_timeout 1h;
    }

    # ---------- AudioStream (8082) ----------
    location = /audiostream { return 301 $scheme://$http_host/audiostream/; }
    location /audiostream/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_buffering off;          # stream audio straight through, don't spool to disk
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        # Pass the browser's Range header through so seeking works
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        # Keep each app's cookie scoped to its own path
        proxy_cookie_path / /audiostream/;
    }

    # ---------- Everything else -> the app formerly on 8080 ----------
    location / {
        proxy_pass http://127.0.0.1:8083;
    }
}
