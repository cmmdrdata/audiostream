<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>AudioStream</title>
<style>
  :root {
    --bg: #14161b; --panel: #1d2027; --panel2: #262a33; --text: #e8e9ec;
    --muted: #8b90a0; --accent: #f0a040; --accent2: #ffbf6b; --ok: #6cc28a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--panel2); }
  header h1 { margin: 0 0 8px; font-size: 18px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid #333846; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .crumbs { font-size: 13px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
  .crumbs a { color: var(--accent2); text-decoration: none; cursor: pointer; }
  main { padding: 12px 16px 220px; max-width: 900px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin: 18px 0 8px; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel); border-radius: 10px; cursor: pointer; position: relative;
    overflow: hidden; }
  .item:hover { background: var(--panel2); }
  .item.playing { outline: 1px solid var(--accent); }
  .item .icon { width: 22px; text-align: center; flex-shrink: 0; }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .item .meta.done { color: var(--ok); }
  .item .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .resume-btn { background: var(--accent); color: #1a1a1a; border: none; font-weight: 600; }
  .empty { color: var(--muted); padding: 10px 2px; }
  #userBtn { margin-left: auto; }
  #picker { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none;
    align-items: center; justify-content: center; padding: 20px; }
  #picker.show { display: flex; }
  #picker .box { width: 100%; max-width: 380px; text-align: center; }
  #picker h2 { font-size: 22px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .users { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .users .u { display: flex; gap: 6px; }
  .users .u button:first-child { flex: 1; padding: 12px; font-size: 16px; text-align: left; }
  .users .u .del { color: var(--muted); }
  #newUser { font: inherit; flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333846;
    background: var(--panel); color: var(--text); }
  #pickErr { color: #e87070; font-size: 13px; min-height: 18px; margin-top: 6px; }

  /* Player */
  #player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #101217ee; backdrop-filter: blur(8px); border-top: 1px solid var(--panel2);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  #player .inner { max-width: 900px; margin: 0 auto; }
  #np-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np-folder { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seek { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .controls { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
  .controls button { min-width: 52px; padding: 8px 6px; border-radius: 10px; }
  .controls .play { min-width: 64px; font-size: 20px; background: var(--accent); color: #1a1a1a; border: none; }
  .controls .skip { font-weight: 600; font-variant-numeric: tabular-nums; }
  .extras { display: flex; justify-content: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  .extras select, .extras button { padding: 4px 8px; font-size: 13px; }
  #player.ad { border-top-color: var(--accent); }
  #player.ad .skip, #player.ad #prevBtn, #player.ad #restartBtn, #player.ad .seek input { visibility: hidden; }
  #skipAdBtn { display: none; }
  #player.ad #skipAdBtn { display: inline-block; background: var(--accent); color: #1a1a1a; border: none; font-weight: 600; }
  #adsCtl { display: none; }
  .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--panel2); }
  .item .icon.has-thumb { width: 36px; }
  .folder-head { display: flex; gap: 14px; align-items: center; margin: 8px 0 4px; }
  .folder-head img { width: 132px; height: 132px; object-fit: cover; border-radius: 10px;
    box-shadow: 0 6px 20px #0008; flex-shrink: 0; }
  .folder-head .t { font-size: 18px; font-weight: 600; word-break: break-word; }
  .np-row { display: flex; gap: 10px; align-items: center; }
  .np-row .np-text { flex: 1; min-width: 0; }
  #np-art { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; display: none; flex-shrink: 0; }
  #np-art.show { display: block; }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 520px) { .hint { display: none; } .controls button { min-width: 46px; } }
</style>
</head>
<body>
<header>
  <h1>Audio<span>Stream</span></h1>
  <div class="row">
    <select id="rootSel" title="Library root"></select>
    <button id="upBtn" title="Up one folder">⬆ Up</button>
    <button id="homeBtn" title="Recently played">🕘 Recent</button>
    <button id="userBtn" title="Switch listener">👤 …</button>
  </div>
  <div class="crumbs" id="crumbs" style="margin-top:8px"></div>
</header>

<main id="main"></main>

<div id="picker">
  <div class="box">
    <h2>Who's listening?</h2>
    <div class="users" id="userList"></div>
    <form class="row" id="newUserForm">
      <input id="newUser" placeholder="New listener name" maxlength="32" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <div id="pickErr"></div>
  </div>
</div>

<div id="player">
  <div class="inner">
    <div class="np-row">
      <img id="np-art" alt="">
      <div class="np-text">
        <div id="np-title">Nothing playing</div>
        <div id="np-folder">Pick a file to start</div>
      </div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seekBar" min="0" max="1000" value="0" step="1">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="prevBtn" title="Previous track">⏮</button>
      <button class="skip" data-skip="-30" title="Back 30s">↺30</button>
      <button class="skip" data-skip="-20" title="Back 20s">↺20</button>
      <button class="play" id="playBtn" title="Play/Pause">▶</button>
      <button class="skip" data-skip="20" title="Forward 20s">20↻</button>
      <button class="skip" data-skip="30" title="Forward 30s">30↻</button>
      <button id="nextBtn" title="Next track">⏭</button>
      <button id="skipAdBtn" title="Skip this commercial">Skip ad ⏭</button>
    </div>
    <div class="extras">
      <label>Speed
        <select id="speedSel">
          <option>0.75</option><option selected>1</option><option>1.1</option><option>1.25</option>
          <option>1.5</option><option>1.75</option><option>2</option>
        </select>
      </label>
      <label>Sleep
        <select id="sleepSel">
          <option value="0">Off</option><option value="15">15 min</option>
          <option value="30">30 min</option><option value="45">45 min</option>
          <option value="60">60 min</option><option value="-1">End of track</option>
        </select>
      </label>
      <span id="adsCtl">
        <label title="Commercial breaks between songs/chapters (saved per listener)">📻
          <input type="checkbox" id="adsOn"> Ads
        </label>
        <label title="Minimum listening minutes between commercial breaks">min
          <input type="number" id="adsEvery" min="1" max="600" step="1" style="width:4.2em"> min apart
        </label>
        <select id="adsCount" title="Commercials per break">
          <option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option>
        </select>
      </span>
      <button id="restartBtn" title="Restart this track from 0:00">⟲ Restart</button>
    </div>
    <div class="hint">Keys: Space play/pause · ←/→ 20s · Shift+←/→ 30s · N/P next/prev track</div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let roots = [];
let currentDir = null;      // listing currently shown
let queue = [];             // files in folder of current track
let current = null;         // {path, name, folder}
let pendingSeek = null;
let lastSaved = 0;
let sleepTimer = null, sleepAtEnd = false;
let seeking = false;

const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};
const enc = encodeURIComponent;
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
};
const basename = p => p.split(/[\\/]/).pop();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Browsing ----------
let me = null;

async function showPicker() {
  if (current) { saveProgress(true); userPause(); }
  const { users } = await api('api/users');
  $('#userList').innerHTML = users.map(u => `
    <div class="u"><button data-u="${esc(u)}">👤 ${esc(u)}</button>
    <button class="del" data-del="${esc(u)}" title="Delete ${esc(u)} and their saved places">✕</button></div>`).join('')
    || '<div class="empty">No listeners yet. Add yourself below.</div>';
  $('#userList').querySelectorAll('[data-u]').forEach(b => b.onclick = () => pickUser(b.dataset.u));
  $('#userList').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(`Delete "${b.dataset.del}" and all their saved places?`)) return;
    await api('api/users/delete', { method: 'POST', body: JSON.stringify({ name: b.dataset.del }) });
    showPicker();
  });
  $('#pickErr').textContent = '';
  $('#picker').classList.add('show');
  $('#newUser').value = '';
}
$('#newUserForm').onsubmit = e => { e.preventDefault(); pickUser($('#newUser').value.trim()); };

async function pickUser(name) {
  try {
    await api('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  } catch (err) { $('#pickErr').textContent = err.message; return; }
  location.reload();   // fresh start as the new listener
}

async function init() {
  const u = await api('api/users');
  if (!u.current) return showPicker();
  me = u.current;
  $('#userBtn').textContent = '👤 ' + me;
  $('#userBtn').onclick = showPicker;
  roots = (await api('api/roots')).roots;
  await loadAdSettings();
  const sel = $('#rootSel');
  sel.innerHTML = roots.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  sel.onchange = () => openDir(sel.value);
  $('#upBtn').onclick = () => currentDir?.parent && openDir(currentDir.parent);
  $('#homeBtn').onclick = showRecent;

  // Restore the last-played track into the player (paused, at saved position)
  const recent = await api('api/recent');
  if (recent.last) {
    const item = recent.items.find(i => i.path === recent.last);
    if (item) await loadTrack(item.path, { autoplay: false });
  }
  const lastDir = LS.get('lastDir:' + me, null);
  if (lastDir) openDir(lastDir).catch(() => showRecent());
  else showRecent();
}

async function openDir(path) {
  const d = await api('api/list?path=' + enc(path));
  currentDir = d;
  LS.set('lastDir:' + me, d.path);
  if (d.root) $('#rootSel').value = d.root;
  renderCrumbs(d);
  renderDir(d);
  window.scrollTo(0, 0);
}

function renderCrumbs(d) {
  const root = d.root || '';
  const rel = d.path.slice(root.length).split(/[\\/]/).filter(Boolean);
  let acc = root;
  const parts = [`<a data-p="${esc(root)}">${esc(root)}</a>`];
  for (const seg of rel) {
    acc = acc.replace(/[\\/]$/, '') + '/' + seg;
    parts.push(`<a data-p="${esc(acc)}">${esc(seg)}</a>`);
  }
  $('#crumbs').innerHTML = parts.join(' / ');
  $('#crumbs').querySelectorAll('a').forEach(a => a.onclick = () => openDir(a.dataset.p));
}

function progressMeta(p) {
  if (!p) return '';
  if (p.finished) return `<span class="meta done">✓ done</span>`;
  return `<span class="meta">${fmt(p.position)}${p.duration ? ' / ' + fmt(p.duration) : ''}</span>`;
}
function progressBar(p) {
  if (!p || !p.duration || p.finished) return '';
  return `<div class="bar" style="width:${Math.min(100, p.position / p.duration * 100)}%"></div>`;
}

const coverUrl = p => 'cover?path=' + enc(p);

function renderDir(d) {
  let html = '';
  if (d.cover) {
    html += `<div class="folder-head"><img src="${coverUrl(d.path)}" alt="" onerror="this.remove()">
      <div class="t">${esc(basename(d.path))}</div></div>`;
  }
  if (d.resume) {
    const f = d.files.find(x => x.path === d.resume);
    html += `<div class="row" style="margin:6px 0 4px">
      <button class="resume-btn" id="resumeBtn">▶ Resume: ${esc(f.name)} @ ${fmt(f.progress.position)}</button></div>`;
  }
  if (d.dirs.length) {
    html += `<h2>Folders</h2><div class="list">` + d.dirs.map(x => `
      <div class="item" data-dir="${esc(x.path)}">
        ${x.cover ? `<img class="thumb" loading="lazy" src="${coverUrl(x.path)}" alt="" onerror="this.outerHTML='<span class=icon>📁</span>'">`
                  : '<span class="icon">📁</span>'}<span class="name">${esc(x.name)}</span>
        ${x.has_progress ? '<span class="dot" title="You have listened in here"></span>' : ''}
      </div>`).join('') + `</div>`;
  }
  if (d.files.length) {
    html += `<h2>Audio files (${d.files.length})</h2><div class="list">` + d.files.map(f => `
      <div class="item ${current?.path === f.path ? 'playing' : ''}" data-file="${esc(f.path)}">
        <span class="icon">${current?.path === f.path ? '🔊' : '🎵'}</span>
        <span class="name">${esc(f.name)}</span>${progressMeta(f.progress)}${progressBar(f.progress)}
      </div>`).join('') + `</div>`;
  }
  if (!d.dirs.length && !d.files.length) html += `<div class="empty">No folders or audio files here.</div>`;
  $('#main').innerHTML = html;

  $('#main').querySelectorAll('[data-dir]').forEach(el => el.onclick = () => openDir(el.dataset.dir));
  $('#main').querySelectorAll('[data-file]').forEach(el => el.onclick = () => {
    queue = d.files;
    loadTrack(el.dataset.file, { autoplay: true });
  });
  const rb = $('#resumeBtn');
  if (rb) rb.onclick = () => { queue = d.files; loadTrack(d.resume, { autoplay: true }); };
}

async function showRecent() {
  const r = await api('api/recent');
  currentDir = null;
  $('#crumbs').textContent = 'Recently played';
  let html = `<h2>Recently played</h2>`;
  if (!r.items.length) {
    html += `<div class="empty">Nothing yet. Pick a folder from the dropdown above and start listening.</div>
      <div class="row"><button id="browseBtn">📁 Browse ${esc(roots[0])}</button></div>`;
  } else {
    html += `<div class="list">` + r.items.map(i => `
      <div class="item" data-file="${esc(i.path)}" data-folder="${esc(i.folder)}">
        ${i.cover ? `<img class="thumb" loading="lazy" src="${coverUrl(i.folder)}" alt="">`
                  : `<span class="icon">${i.progress.finished ? '✓' : '▶'}</span>`}
        <span class="name">${esc(i.name)}<br><small style="color:var(--muted)">${esc(i.folder)}</small></span>
        ${progressMeta(i.progress)}${progressBar(i.progress)}
      </div>`).join('') + `</div>
      <div class="row" style="margin-top:12px"><button id="browseBtn">📁 Browse library</button></div>`;
  }
  $('#main').innerHTML = html;
  $('#browseBtn').onclick = () => openDir(LS.get('lastDir:' + me, roots[0]) || roots[0]);
  $('#main').querySelectorAll('[data-file]').forEach(el => el.onclick = async () => {
    await openDir(el.dataset.folder);          // load folder so next/prev work
    loadTrack(el.dataset.file, { autoplay: true });
  });
}

// ---------- Playback ----------
async function ensureQueueFor(path) {
  const folder = path.replace(/[\\/][^\\/]*$/, '');
  if (queue.some(f => f.path === path)) return;
  try { queue = (await api('api/list?path=' + enc(folder))).files; } catch { queue = []; }
}

async function loadTrack(path, { autoplay = true, fromStart = false } = {}) {
  if (adBreak) cancelBreak();
  if (current && current.path !== path) saveProgress(true);
  await ensureQueueFor(path);
  const folder = path.replace(/[\\/][^\\/]*$/, '');
  current = { path, name: basename(path), folder };

  let start = 0;
  if (!fromStart) {
    try {
      const { progress } = await api('api/progress?path=' + enc(path));
      if (progress && !progress.finished) start = Math.max(0, progress.position - 2); // back up 2s for context
    } catch {}
  }
  pendingSeek = start;
  lastGood = start; everPlayed = false; resetRetry();
  if (autoplay) wantPlaying = true;
  audio.src = 'stream?path=' + enc(path);
  audio.playbackRate = parseFloat($('#speedSel').value);
  $('#np-title').textContent = current.name;
  $('#np-folder').textContent = folder;
  showArt(folder);
  document.title = current.name + ' · AudioStream';
  setMediaSession();
  if (autoplay) audio.play().catch(() => {});
  markPlayingInList();
}

function markPlayingInList() {
  document.querySelectorAll('.item[data-file]').forEach(el => {
    const on = current && el.dataset.file === current.path;
    el.classList.toggle('playing', on);
  });
}

audio.addEventListener('loadedmetadata', () => {
  if (adBreak) {
    const seg = adBreak.list[adBreak.i];
    if (seg.start > 0) audio.currentTime = seg.start;
    return;
  }
  if (pendingSeek != null) {
    if (pendingSeek < audio.duration - 1) audio.currentTime = pendingSeek;
    pendingSeek = null;
  }
  $('#dur').textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (adBreak) {
    const seg = adBreak.list[adBreak.i];
    const end = seg.end ?? audio.duration;
    $('#cur').textContent = fmt(audio.currentTime - seg.start);
    $('#dur').textContent = fmt((end || 0) - seg.start);
    if (end) $('#seekBar').value = Math.round((audio.currentTime - seg.start) / (end - seg.start) * 1000);
    if (seg.end != null && audio.currentTime >= seg.end) nextAd();
    return;
  }
  countListening();
  if (!seeking && audio.duration) $('#seekBar').value = Math.round(audio.currentTime / audio.duration * 1000);
  $('#cur').textContent = fmt(audio.currentTime);
  if (audio.currentTime > 0 && pendingSeek == null) lastGood = audio.currentTime;
  if (Date.now() - lastSaved > 5000 && !audio.paused) saveProgress();
  if ('mediaSession' in navigator && audio.duration && navigator.mediaSession.setPositionState) {
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: audio.playbackRate }); } catch {}
  }
});
audio.addEventListener('play', () => { $('#playBtn').textContent = '⏸'; });
audio.addEventListener('pause', () => {
  $('#playBtn').textContent = '▶';
  if (!adBreak) saveProgress(true);
});
audio.addEventListener('ended', () => {
  if (adBreak) return nextAd();
  saveProgress(true);
  if (sleepAtEnd) { sleepAtEnd = false; wantPlaying = false; $('#sleepSel').value = '0'; return; }
  nextTrackOrBreak();
});
audio.addEventListener('error', () => {
  if (recovering) return;
  if (adBreak) return nextAd();   // unplayable ad: just move on
  if (!current) return;
  const code = audio.error ? audio.error.code : 0;
  if (code === 4 && !everPlayed) {
    // "Not supported" before it ever played: ask the server if the file is reachable.
    // Reachable = the browser really can't play this format. Unreachable = network, so retry.
    const path = current.path;
    fetch('stream?path=' + enc(path), { method: 'HEAD', cache: 'no-store' })
      .then(r => {
        if (!current || current.path !== path) return;
        if (r.ok) { resetRetry(); $('#np-folder').textContent = '⚠ This browser cannot play this file format.'; }
        else recover('error 4, server said ' + r.status);
      })
      .catch(() => recover('error 4, server unreachable'));
    return;
  }
  recover('error ' + code);
});

// ---------- Auto-retry after network drops ----------
let wantPlaying = false;     // the listener wants sound (not paused by them)
let lastGood = 0;            // last position that actually played
let everPlayed = false;
let recovering = false;
let lastTick = Date.now(), lastTickPos = -1;
const retry = { n: 0, timer: null };
const RETRY_DELAYS = [1, 2, 4, 8, 15, 30];   // seconds; keeps trying every 30s after that

// A pause the listener asked for (button, lock screen, sleep timer): stop retrying too
function userPause() {
  wantPlaying = false;
  clearTimeout(retry.timer); retry.timer = null;
  audio.pause();
}
function togglePlayIfPaused() { if (audio.paused || audio.error || retry.n) togglePlay(); }

function resetRetry() {
  clearTimeout(retry.timer); retry.timer = null;
  if (retry.n && current) $('#np-folder').textContent = current.folder;
  retry.n = 0;
}

function recover(reason) {
  if (adBreak || !current || retry.timer) return;
  const delay = RETRY_DELAYS[Math.min(retry.n, RETRY_DELAYS.length - 1)];
  retry.n++;
  console.log('[AudioStream] reconnecting:', reason, 'attempt', retry.n, 'at', fmt(lastGood));
  $('#np-folder').textContent = `⚠ Connection lost - retrying in ${delay}s (try ${retry.n})…`;
  retry.timer = setTimeout(() => {
    retry.timer = null;
    if (!current || adBreak) return;
    recovering = true;
    pendingSeek = lastGood;
    // a fresh URL so the browser doesn't reuse the broken connection
    audio.src = 'stream?path=' + enc(current.path) + '&retry=' + Date.now();
    audio.playbackRate = parseFloat($('#speedSel').value);
    recovering = false;
    if (wantPlaying) audio.play().catch(() => {});
    else audio.load();
  }, delay * 1000);
}

audio.addEventListener('playing', () => {
  wantPlaying = true; everPlayed = true;
  if (retry.n) { console.log('[AudioStream] reconnected'); resetRetry(); }
});

// Watchdog: playing but the clock hasn't moved for 20s = silently stalled stream
setInterval(() => {
  const pos = audio.currentTime;
  if (pos !== lastTickPos || audio.paused || !wantPlaying) { lastTick = Date.now(); lastTickPos = pos; return; }
  if (Date.now() - lastTick < 20000 || retry.timer) return;
  lastTick = Date.now();
  if (adBreak) nextAd();          // stuck ad: skip it
  else recover('stalled');
}, 5000);

// Phone came back online / tab woke up: retry right away instead of waiting
window.addEventListener('online', () => {
  if (retry.timer) { clearTimeout(retry.timer); retry.timer = null; retry.n = Math.max(0, retry.n - 1); recover('back online'); }
});

function saveProgress(force = false) {
  if (adBreak || !current || !audio.duration) return;
  lastSaved = Date.now();
  const body = JSON.stringify({ path: current.path, position: audio.currentTime, duration: audio.duration });
  if (force && navigator.sendBeacon) {
    navigator.sendBeacon('api/progress', new Blob([body], { type: 'application/json' }));
  } else {
    fetch('api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {});
  }
}
window.addEventListener('pagehide', () => saveProgress(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(true); });

function skip(sec) {
  if (adBreak || !audio.duration) return;
  audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration - 0.5);
  saveProgress();
}
function togglePlay() {
  if (!current) return;
  if (audio.error || retry.n) {            // broken: pressing play retries now
    wantPlaying = true;
    clearTimeout(retry.timer); retry.timer = null;
    retry.n = 0; recover('play pressed');
    return;
  }
  if (audio.paused) { wantPlaying = true; audio.play().catch(() => {}); }
  else userPause();
}
function trackIndex() { return queue.findIndex(f => f.path === current?.path); }
function nextTrack() {
  if (adBreak) return nextAd();
  const i = trackIndex();
  if (i >= 0 && i < queue.length - 1) loadTrack(queue[i + 1].path, { autoplay: true, fromStart: false });
}
function prevTrack() {
  if (adBreak) return;
  if (audio.currentTime > 5) { audio.currentTime = 0; return; }
  const i = trackIndex();
  if (i > 0) loadTrack(queue[i - 1].path, { autoplay: true });
}

// Controls
document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => skip(parseInt(b.dataset.skip)));
$('#playBtn').onclick = togglePlay;
$('#nextBtn').onclick = nextTrack;
$('#prevBtn').onclick = prevTrack;
$('#skipAdBtn').onclick = () => nextAd();
$('#restartBtn').onclick = () => { audio.currentTime = 0; saveProgress(); };

const seekBar = $('#seekBar');
seekBar.addEventListener('input', () => { seeking = true; $('#cur').textContent = fmt(seekBar.value / 1000 * (audio.duration || 0)); });
seekBar.addEventListener('change', () => {
  if (adBreak) { seeking = false; return; }
  if (audio.duration) audio.currentTime = seekBar.value / 1000 * audio.duration;
  seeking = false; saveProgress();
});

const speedSel = $('#speedSel');
speedSel.value = String(LS.get('speed', '1'));
speedSel.onchange = () => { audio.playbackRate = parseFloat(speedSel.value); LS.set('speed', speedSel.value); };

$('#sleepSel').onchange = e => {
  clearTimeout(sleepTimer); sleepAtEnd = false;
  const v = parseInt(e.target.value);
  if (v === -1) sleepAtEnd = true;
  else if (v > 0) sleepTimer = setTimeout(() => { userPause(); e.target.value = '0'; }, v * 60000);
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); skip(e.shiftKey ? 30 : 20); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(e.shiftKey ? -30 : -20); }
  else if (e.key === 'n' || e.key === 'N') nextTrack();
  else if (e.key === 'p' || e.key === 'P') prevTrack();
});

// ---------- Commercial breaks ----------
let adBreak = null;          // {list: [segments], i, nextPath}
let adSegments = [];
let adSettings = { ads_enabled: false, ads_every_min: 30, ads_per_break: 2 };
let recentAds = [];
let listened = 0, lastT = null;

async function loadAdSettings() {
  try {
    const info = await api('api/ads');
    adSegments = info.segments || [];
    adSettings = await api('api/settings');
  } catch { adSegments = []; }
  listened = LS.get('adListened:' + me, 0);
  if (!adSegments.length) return;           // no ads folder: hide the control
  $('#adsCtl').style.display = 'inline';
  $('#adsOn').checked = adSettings.ads_enabled;
  $('#adsEvery').value = String(adSettings.ads_every_min);
  $('#adsCount').value = String(adSettings.ads_per_break);
  $('#adsEvery').disabled = $('#adsCount').disabled = !adSettings.ads_enabled;
}
async function saveAdSettings() {
  const on = $('#adsOn').checked;
  const every = Math.max(1, Math.min(600, parseInt($('#adsEvery').value) || 30));
  $('#adsEvery').value = every;
  const body = { ads_enabled: on, ads_every_min: every, ads_per_break: parseInt($('#adsCount').value) };
  $('#adsEvery').disabled = $('#adsCount').disabled = !on;
  try {
    adSettings = await api('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {}
}
$('#adsOn').onchange = saveAdSettings;
$('#adsEvery').onchange = saveAdSettings;
$('#adsCount').onchange = saveAdSettings;

// Count real listening time (not seeks, not ads) toward the next break
function countListening() {
  const t = audio.currentTime;
  if (!audio.paused && lastT != null) {
    const d = (t - lastT) / (audio.playbackRate || 1);
    if (d > 0 && d < 2) listened += d;
  }
  lastT = t;
  if (Math.random() < 0.05) LS.set('adListened:' + me, Math.round(listened));
}
audio.addEventListener('seeking', () => {
  lastT = null;
  if (!adBreak && pendingSeek == null && audio.currentTime > 0) lastGood = audio.currentTime;  // remember jumps too
});

function nextTrackOrBreak() {
  const i = trackIndex();
  if (i < 0 || i >= queue.length - 1) return;       // end of folder: no break
  const due = adSettings.ads_enabled && adSegments.length &&
              listened >= adSettings.ads_every_min * 60;
  if (due) startBreak(queue[i + 1].path);
  else nextTrack();
}

function pickAds(n) {
  n = Math.min(n, adSegments.length);
  const key = a => a.file + '@' + a.start;
  // avoid repeating recently heard ads when there are enough to choose from
  let pool = adSegments.filter(a => !recentAds.includes(key(a)));
  if (pool.length < n) { recentAds = []; pool = adSegments.slice(); }
  const picks = [];
  while (picks.length < n) picks.push(...pool.splice(Math.floor(Math.random() * pool.length), 1));
  recentAds.push(...picks.map(key));
  recentAds = recentAds.slice(-Math.max(0, adSegments.length - n));
  return picks;
}

function startBreak(nextPath) {
  hideArt();
  adBreak = { list: pickAds(adSettings.ads_per_break), i: -1, nextPath };
  $('#player').classList.add('ad');
  $('#np-title').textContent = '📻 Commercial break';
  $('#np-folder').textContent = 'Up next: ' + basename(nextPath);
  document.title = 'Commercial break · AudioStream';
  if ('mediaSession' in navigator)
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Commercial break', artist: 'Up next: ' + basename(nextPath) });
  playAd(0);
}

function playAd(i) {
  adBreak.i = i;
  const seg = adBreak.list[i];
  const url = 'adstream?f=' + enc(seg.file);
  $('#np-title').textContent = `📻 Commercial break · ${i + 1} of ${adBreak.list.length}`;
  audio.playbackRate = 1;
  if (audio.src.endsWith(url) && audio.readyState >= 1) {
    audio.currentTime = seg.start;               // same compilation file: just jump
  } else {
    audio.src = url;
  }
  audio.play().catch(() => {});
}

function nextAd() {
  if (!adBreak) return;
  if (adBreak.i + 1 < adBreak.list.length) playAd(adBreak.i + 1);
  else endBreak();
}

function cancelBreak() {
  adBreak = null;
  current = null;              // the ad isn't a book position: don't save it
  listened = 0; lastT = null;
  LS.set('adListened:' + me, 0);
  $('#player').classList.remove('ad');
}

function endBreak() {
  const next = adBreak.nextPath;
  cancelBreak();
  loadTrack(next, { autoplay: true });
}

// ---------- Cover art ----------
let artFolder = null, artOk = false;
const npArt = $('#np-art');
function showArt(folder) {
  if (folder === artFolder) { npArt.classList.toggle('show', artOk); return; }
  artFolder = folder; artOk = false;
  npArt.classList.remove('show');
  npArt.src = coverUrl(folder);
}
npArt.addEventListener('load', () => { artOk = true; npArt.classList.add('show'); setMediaSession(); });
npArt.addEventListener('error', () => { artOk = false; npArt.classList.remove('show'); });
function hideArt() { npArt.classList.remove('show'); }

// Lock-screen / headphone / car controls
function setMediaSession() {
  if (!('mediaSession' in navigator) || !current || adBreak) return;
  const artwork = artOk && artFolder === current.folder
    ? [{ src: new URL(coverUrl(current.folder), location.href).href, sizes: '512x512' }] : [];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: current.name.replace(/\.[^.]+$/, ''),
    artist: basename(current.folder),
    album: current.folder,
    artwork,
  });
  const ms = navigator.mediaSession;
  const h = (a, fn) => { try { ms.setActionHandler(a, fn); } catch {} };
  h('play', () => togglePlayIfPaused());
  h('pause', () => userPause());
  h('seekbackward', d => skip(-(d.seekOffset || 30)));
  h('seekforward', d => skip(d.seekOffset || 30));
  h('previoustrack', prevTrack);
  h('nexttrack', nextTrack);
  h('seekto', d => { audio.currentTime = d.seekTime; });
}

init().catch(err => { $('#main').innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; });
</script>
</body>
</html>
